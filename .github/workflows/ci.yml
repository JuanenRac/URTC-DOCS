name: URTC CI baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Validate project baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Baseline (Python, project validation and compilation of the sources)
        uses: ./.github/actions/urtc-baseline
      - name: Static checks (unused names, exception chaining, syntax)
        run: |
          python -m pip install "ruff==0.17.1"
          ruff check .
      - name: Install and run the real Python test suite (includes the generator checks)
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
          python -m pytest tests/ -q --cov=src --cov-fail-under=84
      - name: Type check
        run: python -m mypy
      - name: Check the generated files are current
        run: |
          python tools/make_readmes.py --check
          python tools/make_brand.py --check
          python tools/make_catalog.py --check-structure

  windows:
    name: Tests on Windows
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Run the tests (line endings and .bat scripts behave differently on Windows)
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
          python -m pytest tests -q
