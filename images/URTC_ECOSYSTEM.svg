<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc">
  <title id="title">URTC</title><desc id="desc">The repositories of URTC, the CAN bus that joins the boards and the host tools, and the links that their documents state</desc>
  <defs><linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#07090C"/><stop offset="1" stop-color="#12161C"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="1200" height="710" fill="url(#bg)"/>
  <text x="600" y="46" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#FFF" letter-spacing="6">URTC ECOSYSTEM</text>
  <path d="M60 267.0 H1140" stroke="#FFB020" stroke-width="3" opacity=".85"/>
  <text x="400" y="257.0" text-anchor="middle" font-family="monospace" font-size="13" fill="#FFB020">CAN bus, 500 kbit/s: URTC/docs/CANBUS.TXT</text>
  <text x="800" y="291.0" text-anchor="middle" font-family="monospace" font-size="12" fill="#00E5FF" opacity=".8">via a USB-CAN adapter (SLCAN / SocketCAN)</text>
  <path d="M200 188 V267.0" stroke="#00E5FF" stroke-width="1.8" opacity=".6"/><circle cx="200" cy="267.0" r="4" fill="#FFB020"/>
  <path d="M600 188 V267.0" stroke="#00E5FF" stroke-width="1.8" opacity=".6" stroke-dasharray="5 6"/><circle cx="600" cy="267.0" r="4" fill="#FFB020"/>
  <path d="M1000 188 V267.0" stroke="#00E5FF" stroke-width="1.8" opacity=".6" stroke-dasharray="5 6"/><circle cx="1000" cy="267.0" r="4" fill="#FFB020"/>
  <path d="M200 346 V267.0" stroke="#00E5FF" stroke-width="1.8" opacity=".6"/><circle cx="200" cy="267.0" r="4" fill="#FFB020"/>
  <path d="M600 346 V267.0" stroke="#00E5FF" stroke-width="1.8" opacity=".6"/><circle cx="600" cy="267.0" r="4" fill="#FFB020"/>
  <path d="M1000 346 V267.0" stroke="#00E5FF" stroke-width="1.8" opacity=".6"/><circle cx="1000" cy="267.0" r="4" fill="#FFB020"/>
  <path d="M495.0 621.0 H705.0" stroke="#00FF66" stroke-width="1.2" stroke-dasharray="4 6" opacity=".5"/>
  <g transform="translate(55.0 110)"><rect width="290" height="78" rx="12" fill="#161208" stroke="#FFB020" stroke-width="1.4" opacity=".95"/><text x="145.0" y="34" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#FFF">URTC</text><text x="145.0" y="58" text-anchor="middle" font-family="monospace" font-size="12" fill="#FFB020" opacity=".85">tool-head board firmware</text></g>
  <g transform="translate(455.0 110)"><rect width="290" height="78" rx="12" fill="#161208" stroke="#00E5FF" stroke-width="1.4" opacity=".95"/><text x="145.0" y="34" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#FFF">URTC-SMART-RACK</text><text x="145.0" y="58" text-anchor="middle" font-family="monospace" font-size="12" fill="#00E5FF" opacity=".85">rack firmware, no board yet</text></g>
  <g transform="translate(855.0 110)"><rect width="290" height="78" rx="12" fill="#161208" stroke="#00E5FF" stroke-width="1.4" opacity=".95"/><text x="145.0" y="34" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#FFF">URTC-VISION-TOOL</text><text x="145.0" y="58" text-anchor="middle" font-family="monospace" font-size="12" fill="#00E5FF" opacity=".85">inspection head, no board yet</text></g>
  <g transform="translate(55.0 346)"><rect width="290" height="78" rx="12" fill="#161208" stroke="#00E5FF" stroke-width="1.4" opacity=".95"/><text x="145.0" y="34" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#FFF">URTC-FLASHER</text><text x="145.0" y="58" text-anchor="middle" font-family="monospace" font-size="12" fill="#00E5FF" opacity=".85">flash over CAN or SWD</text></g>
  <g transform="translate(455.0 346)"><rect width="290" height="78" rx="12" fill="#161208" stroke="#00E5FF" stroke-width="1.4" opacity=".95"/><text x="145.0" y="34" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#FFF">URTC-TESTER</text><text x="145.0" y="58" text-anchor="middle" font-family="monospace" font-size="12" fill="#00E5FF" opacity=".85">live bus tester</text></g>
  <g transform="translate(855.0 346)"><rect width="290" height="78" rx="12" fill="#161208" stroke="#00E5FF" stroke-width="1.4" opacity=".95"/><text x="145.0" y="34" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#FFF">URTC-WEB-STUDIO</text><text x="145.0" y="58" text-anchor="middle" font-family="monospace" font-size="12" fill="#00E5FF" opacity=".85">browser flasher and tester</text></g>
  <g transform="translate(455.0 464)"><rect width="290" height="78" rx="12" fill="#161208" stroke="#00E5FF" stroke-width="1.4" opacity=".95"/><text x="145.0" y="34" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#FFF">URTC-COMMON</text><text x="145.0" y="58" text-anchor="middle" font-family="monospace" font-size="12" fill="#00E5FF" opacity=".85">the CAN protocol as data</text></g>
  <g transform="translate(205.0 582)"><rect width="290" height="78" rx="12" fill="#161208" stroke="#00E5FF" stroke-width="1.4" opacity=".95"/><text x="145.0" y="34" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#FFF">URTC-UPDATER</text><text x="145.0" y="58" text-anchor="middle" font-family="monospace" font-size="12" fill="#00E5FF" opacity=".85">reads the manifests</text></g>
  <g transform="translate(705.0 582)"><rect width="290" height="78" rx="12" fill="#161208" stroke="#00E5FF" stroke-width="1.4" opacity=".95"/><text x="145.0" y="34" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#FFF">URTC-DOCS</text><text x="145.0" y="58" text-anchor="middle" font-family="monospace" font-size="12" fill="#00E5FF" opacity=".85">this repository</text></g>
  <text x="600" y="696" text-anchor="middle" font-family="monospace" font-size="12" fill="#00FF66" opacity=".7">dashed to the bus: documented for it, but no board exists yet  ·  green: URTC-UPDATER reads the manifests that URTC-DOCS tabulates</text>
</svg>
